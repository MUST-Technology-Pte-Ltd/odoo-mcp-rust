# Build release binaries on a version tag and attach them to a GitHub Release.
#
# TLS comes from ureq's rustls backend (pure Rust), so every target
# cross-compiles without a system OpenSSL. Binaries are unsigned; bundling a
# signed copy inside a desktop app is that app's signing pipeline's job, not
# this one's. Tag with `vX.Y.Z` to trigger.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: odoo-mcp
            asset: odoo-mcp-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: odoo-mcp.exe
            asset: odoo-mcp-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: odoo-mcp
            asset: odoo-mcp-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
